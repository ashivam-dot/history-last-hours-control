name: Unattended private History control (policy gated)

on:
  schedule:
    # About five hours after each 05:05/11:05/17:05/23:05 IST Modal studio cycle.
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      resume_episode:
        description: Resume one held pre-release episode after inspecting its issue
        required: false
        type: string
      approved_qa_run_id:
        description: Reuse a prior private passing QA artifact for the exact same packet
        required: false
        type: string

concurrency:
  group: history-unattended-control
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || vars.HISTORY_CONTROL_AUTOMATION == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      episode: ${{ steps.select.outputs.episode }}
      commit: ${{ steps.select.outputs.commit }}
      intake_enabled: ${{ steps.select.outputs.intake_enabled }}
      signing_enabled: ${{ steps.select.outputs.signing_enabled }}
      publishing_enabled: ${{ steps.select.outputs.publishing_enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Skip dependency installation only while release is disabled and there is no work
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_EPISODE: ${{ inputs.resume_episode }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.error, urllib.request
          from pathlib import Path
          if os.environ.get('RESUME_EPISODE'):
              raise SystemExit(0)
          config = json.loads(Path('policy.json').read_text())
          # A live empty queue must reach discover(), which opens a durable
          # owner issue. Only the dormant path may skip that dependency cost.
          if all(config.get(name) is True for name in
                 ('intake_enabled', 'signing_enabled', 'publishing_enabled')):
              raise SystemExit(0)
          floor = int(config['min_episode_id'][2:])
          paths = subprocess.check_output([
              'git', '-C', 'source', 'ls-tree', '-r', '--name-only', 'HEAD', '--', 'content/episodes'
          ], text=True).splitlines()
          drafts = any((match := re.fullmatch(r'content/episodes/ep([0-9]{3,})/draft\.json', path))
                       and int(match.group(1)) >= floor for path in paths)
          if drafts:
              raise SystemExit(0)
          url = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] +
                 '/contents/receipts?ref=unattended-state')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          try:
              with urllib.request.urlopen(request, timeout=15):
                  pass
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  print('skip=true', file=out)
          PY
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.preflight.outputs.skip != 'true'
      - if: steps.preflight.outputs.skip != 'true'
        run: uv sync --frozen --python 3.12 --no-dev
      - name: Pin one main-ancestry draft and claim its private receipt
        id: select
        if: steps.preflight.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_EPISODE: ${{ inputs.resume_episode }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          git -C source checkout -B main "$(git -C source rev-parse HEAD)"
          uv run --frozen --no-dev python -m control.orchestrate discover \
            --source source --output selection.json --resume-episode "$RESUME_EPISODE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          selected = json.loads(Path('selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, field in (('episode', 'episode'), ('commit', 'source_commit')):
                  print(f'{key}={selected.get(field, "")}', file=out)
              for key in ('intake_enabled', 'signing_enabled', 'publishing_enabled'):
                  print(f'{key}={str(selected.get(key, False)).lower()}', file=out)
          PY

  intake:
    needs: discover
    if: needs.discover.outputs.episode != '' && needs.discover.outputs.intake_enabled == 'true'
    environment: history-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: ${{ needs.discover.outputs.commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --no-dev
      - name: Confirm producer main still has the pinned unreleased draft
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control.orchestrate current \
            --source source --episode "$EPISODE" --commit "$SOURCE_COMMIT"
      - name: Recheck receipt and intake policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate gate --episode "$EPISODE" --commit "$SOURCE_COMMIT" --operation intake
      - name: Read exact private Modal render and make authenticated review packet
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
          MODAL_TOKEN_ID: ${{ secrets.HISTORY_INTAKE_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.HISTORY_INTAKE_MODAL_TOKEN_SECRET }}
          HISTORY_INTAKE_CLOUDINARY_URL: ${{ secrets.HISTORY_PUBLISHER_CLOUDINARY_URL }}
        run: |
          umask 077
          mkdir -m 700 private
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control intake \
            --source source --commit "$SOURCE_COMMIT" --episode "$EPISODE" \
            --output private/review-packet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-draft-${{ github.run_id }}
          path: private/review-packet/
          retention-days: 1
          if-no-files-found: error
      - name: Record exact private intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate advance --episode "$EPISODE" --commit "$SOURCE_COMMIT" --phase intake_verified

  qa:
    needs: [discover, intake]
    if: needs.intake.result == 'success'
    environment: history-independent-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: ${{ needs.discover.outputs.commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --no-dev
      - name: Install and verify full-media decoders
        if: inputs.approved_qa_run_id == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Confirm producer main still has the pinned unreleased draft
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control.orchestrate current \
            --source source --episode "$EPISODE" --commit "$SOURCE_COMMIT"
      - name: Recheck receipt and QA policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate gate --episode "$EPISODE" --commit "$SOURCE_COMMIT" --operation qa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-draft-${{ github.run_id }}
          path: private/review-packet
      - name: Independently inspect sources, rights, full video, and audio
        if: inputs.approved_qa_run_id == ''
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
          HISTORY_QA_GEMINI_API_KEY: ${{ secrets.HISTORY_QA_GEMINI_API_KEY }}
        run: |
          umask 077
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control qa-draft \
            --source source --commit "$SOURCE_COMMIT" --episode "$EPISODE" \
            --packet private/review-packet \
            --report private/qa_report.json --approval private/approval.json
      - name: Download prior private passing QA for the same exact packet
        if: inputs.approved_qa_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-qa-pass-${{ inputs.approved_qa_run_id }}
          run-id: ${{ inputs.approved_qa_run_id }}
          github-token: ${{ github.token }}
          path: private/prior-qa
      - name: Reverify prior QA against the current exact private packet
        if: inputs.approved_qa_run_id != ''
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: |
          umask 077
          uv run --frozen --no-dev python - <<'PY'
          import os
          from pathlib import Path
          from control.intake import validated_packet
          from control.qa import verified_qa_report
          from control.release import policy, read_object

          config = policy(Path('policy.json'))
          packet = Path('private/review-packet')
          subject, _ = validated_packet(Path('source'), os.environ['SOURCE_COMMIT'],
                                        os.environ['EPISODE'], config, packet)
          prior = Path('private/prior-qa')
          report = read_object((prior / 'qa_report.json').read_bytes(), 'prior private QA report')
          approval = read_object((prior / 'approval.json').read_bytes(), 'prior private QA approval')
          verified_qa_report(report, approval, subject, config, packet)
          Path('private/qa_report.json').write_bytes((prior / 'qa_report.json').read_bytes())
          Path('private/approval.json').write_bytes((prior / 'approval.json').read_bytes())
          print('Prior private QA binds the exact current packet')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: private-qa-report-${{ github.run_id }}
          path: private/qa_report.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: private-qa-pass-${{ github.run_id }}
          path: |
            private/qa_report.json
            private/approval.json
          retention-days: 1
          if-no-files-found: error
      - name: Record approved QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate advance --episode "$EPISODE" --commit "$SOURCE_COMMIT" --phase qa_approved

  sign:
    needs: [discover, qa]
    if: needs.qa.result == 'success' && needs.discover.outputs.signing_enabled == 'true'
    environment: history-review-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: ${{ needs.discover.outputs.commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --no-dev
      - name: Confirm producer main still has the pinned unreleased draft
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control.orchestrate current \
            --source source --episode "$EPISODE" --commit "$SOURCE_COMMIT"
      - name: Recheck receipt and signing policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate gate --episode "$EPISODE" --commit "$SOURCE_COMMIT" --operation sign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-draft-${{ github.run_id }}
          path: private/review-packet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-qa-pass-${{ github.run_id }}
          path: private/qa-result
      - name: Reverify passing QA and sign exact draft
        env:
          HISTORY_CONTROL_POLICY_TOKEN: ${{ github.token }}
          HISTORY_UNATTENDED_LIVE_POLICY: '1'
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
          HISTORY_REVIEW_SIGNING_KEY: ${{ secrets.HISTORY_REVIEW_SIGNING_KEY }}
        run: |
          umask 077
          env -u HISTORY_CONTROL_POLICY_TOKEN git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control sign-qa-draft \
            --source source --commit "$SOURCE_COMMIT" --episode "$EPISODE" \
            --packet private/review-packet --qa-report private/qa-result/qa_report.json \
            --approval private/qa-result/approval.json --output private/independent_review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-signed-review-${{ github.run_id }}
          path: private/independent_review.json
          retention-days: 1
          if-no-files-found: error
      - name: Record signed review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate advance --episode "$EPISODE" --commit "$SOURCE_COMMIT" --phase signed

  publish:
    needs: [discover, sign]
    if: needs.sign.result == 'success' && needs.discover.outputs.publishing_enabled == 'true'
    concurrency:
      group: history-control-publisher
      cancel-in-progress: false
    environment: history-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: ${{ needs.discover.outputs.commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --no-dev
      - name: Confirm producer main still has the pinned unreleased draft
        env:
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          uv run --frozen --no-dev python -m control.orchestrate current \
            --source source --episode "$EPISODE" --commit "$SOURCE_COMMIT"
      - name: Recheck receipt and publishing policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate gate --episode "$EPISODE" --commit "$SOURCE_COMMIT" --operation publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-draft-${{ github.run_id }}
          path: private/review-packet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-signed-review-${{ github.run_id }}
          path: private
      - name: Persist exclusive future release slot before any publisher mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate reserve --episode "$EPISODE" --commit "$SOURCE_COMMIT" --output reserved.json
      - name: Release approved exact media to pinned YouTube channel
        env:
          HISTORY_CONTROL_POLICY_TOKEN: ${{ github.token }}
          HISTORY_UNATTENDED_LIVE_POLICY: '1'
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
          HISTORY_PUBLISHER_BUFFER_API_KEY: ${{ secrets.HISTORY_PUBLISHER_BUFFER_API_KEY }}
          HISTORY_PUBLISHER_CLOUDINARY_URL: ${{ secrets.HISTORY_PUBLISHER_CLOUDINARY_URL }}
        run: |
          umask 077
          env -u HISTORY_CONTROL_POLICY_TOKEN git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          DUE_AT_UTC="$(env -u HISTORY_CONTROL_POLICY_TOKEN python3 -c 'import json; print(json.load(open("reserved.json"))["due_at_utc"])')"
          uv run --frozen --no-dev python -m control publish-draft \
            --source source --commit "$SOURCE_COMMIT" --episode "$EPISODE" \
            --packet private/review-packet --review private/independent_review.json \
            --public-key reviewer.pub --due-at-utc "$DUE_AT_UTC" \
            --output private/publisher-receipt.json
      - name: Record verified publisher receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
        run: uv run --frozen --no-dev python -m control.orchestrate complete --episode "$EPISODE" --commit "$SOURCE_COMMIT" --publisher-receipt private/publisher-receipt.json

  alert:
    needs: [discover, intake, qa, sign, publish]
    if: always() && (needs.discover.result == 'failure' || needs.intake.result == 'failure' || needs.qa.result == 'failure' || needs.sign.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --no-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always() && needs.qa.result == 'failure'
        continue-on-error: true
        with:
          name: private-qa-report-${{ github.run_id }}
          path: private/qa-failure
      - name: Hold candidate and open or update private failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPISODE: ${{ needs.discover.outputs.episode }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          INTAKE_RESULT: ${{ needs.intake.result }}
          QA_RESULT: ${{ needs.qa.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          for stage in discover intake qa sign publish; do
            key="${stage^^}_RESULT"
            if [ "${!key}" = failure ]; then
              uv run --frozen --no-dev python -m control.orchestrate fail \
                --episode "$EPISODE" --stage "$stage" \
                --qa-report private/qa-failure/qa_report.json
              break
            fi
          done
