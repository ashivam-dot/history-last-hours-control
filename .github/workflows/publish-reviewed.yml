name: Publish independently reviewed History episode (disabled)

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact producer commit from the signed review
        required: true
      episode:
        description: Reviewed episode
        required: true
      review_json:
        description: Complete signed independent_review.json
        required: true
      due_at_utc:
        description: UTC due time more than 30 minutes and less than 30 days ahead
        required: true

permissions:
  contents: read

concurrency:
  group: history-control-publisher
  cancel-in-progress: false

jobs:
  publish:
    environment: history-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate immutable input
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EPISODE: ${{ inputs.episode }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EPISODE" =~ ^ep[0-9]{3,}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ashivam-dot/creature-receipts
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Confirm read-only source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install locked control only
        run: uv sync --frozen --python 3.12 --no-dev
      - name: Save signed review input
        env:
          REVIEW_JSON: ${{ inputs.review_json }}
        run: |
          mkdir -m 700 private
          uv run --frozen --no-dev python -c 'import os,pathlib; pathlib.Path("private/independent_review.json").write_text(os.environ["REVIEW_JSON"], encoding="utf-8")'
      - name: Exact-media release (policy remains disabled)
        env:
          HISTORY_PUBLISHER_BUFFER_API_KEY: ${{ secrets.HISTORY_PUBLISHER_BUFFER_API_KEY }}
          HISTORY_PUBLISHER_CLOUDINARY_URL: ${{ secrets.HISTORY_PUBLISHER_CLOUDINARY_URL }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EPISODE: ${{ inputs.episode }}
          DUE_AT_UTC: ${{ inputs.due_at_utc }}
        run: |
          uv run --frozen --no-dev python -m control publish \
            --source source --commit "$SOURCE_COMMIT" --episode "$EPISODE" \
            --review private/independent_review.json --public-key reviewer.pub \
            --due-at-utc "$DUE_AT_UTC" --output private/publisher-receipt.json
      - name: Keep private receipt for one day
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-history-publisher-receipt
          path: private/publisher-receipt.json
          retention-days: 1
          if-no-files-found: error
