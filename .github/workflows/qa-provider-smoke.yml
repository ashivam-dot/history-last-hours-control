name: Check pinned History QA provider (one request)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-qa-provider-smoke
  cancel-in-progress: false

jobs:
  check:
    environment: history-independent-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the exact policy model with one small request
        env:
          HISTORY_QA_GEMINI_API_KEY: ${{ secrets.HISTORY_QA_GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          config = json.loads(Path('policy.json').read_text(encoding='utf-8'))
          model = config.get('qa_model')
          if config.get('qa_provider') != 'gemini' or not isinstance(model, str) or not re.fullmatch(r'[A-Za-z0-9._-]+', model):
              raise SystemExit('Pinned QA provider policy is invalid')
          key = os.environ.get('HISTORY_QA_GEMINI_API_KEY')
          if not key:
              raise SystemExit('Independent QA provider credential is unavailable')
          payload = json.dumps({
              'contents': [{'role': 'user', 'parts': [{'text': 'Reply OK.'}]}],
              'generationConfig': {'maxOutputTokens': 16, 'temperature': 0},
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',
              data=payload, method='POST', headers={
                  'Content-Type': 'application/json', 'x-goog-api-key': key,
              })
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  body = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f'provider_http={exc.code}')
              raise SystemExit(2) from None
          except (urllib.error.URLError, TimeoutError, ValueError):
              print('provider_network_or_response_error')
              raise SystemExit(2) from None
          candidates = body.get('candidates') if isinstance(body, dict) else None
          if not isinstance(candidates, list) or not candidates or not isinstance(candidates[0], dict):
              print(f'provider_http={status} no_candidate')
              raise SystemExit(2)
          finish = candidates[0].get('finishReason')
          if not isinstance(finish, str) or not re.fullmatch(r'[A-Z_]+', finish):
              print(f'provider_http={status} invalid_finish_reason')
              raise SystemExit(2)
          print(f'provider_http={status} finish_reason={finish}')
          PY
