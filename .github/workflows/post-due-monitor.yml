name: Verify History YouTube delivery after the due time

on:
  schedule:
    # Two hours after the control's reserved 17:00 UTC daily release slot.
    - cron: '0 19 * * *'
    # One-time ep065 proof checks. The job also checks the full UTC date.
    - cron: '45 17 4 10 *'
    - cron: '5 19 4 10 *'
  workflow_dispatch:

concurrency:
  group: history-unattended-control
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.HISTORY_CONTROL_AUTOMATION == '1' || github.event.schedule == '45 17 4 10 *' || github.event.schedule == '5 19 4 10 *'
    environment: history-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      - name: Limit the one-time ep065 checks to 2026-10-04 UTC
        id: window
        env:
          CONTROL_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$CONTROL_SCHEDULE" == '45 17 4 10 *' || "$CONTROL_SCHEDULE" == '5 19 4 10 *' ]]; then
            if [[ "$(date -u +%F)" != '2026-10-04' ]]; then
              exit 0
            fi
            echo 'episode=ep065' >> "$GITHUB_OUTPUT"
            if [[ "$CONTROL_SCHEDULE" == '45 17 4 10 *' ]]; then
              echo 'early=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.proceed == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.proceed == 'true'
        with:
          repository: ashivam-dot/creature-receipts
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.window.outputs.proceed == 'true'
      - run: uv sync --frozen --python 3.12 --no-dev
        if: steps.window.outputs.proceed == 'true'
      - name: Verify exact Buffer post and public YouTube video
        if: steps.window.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HISTORY_PUBLISHER_BUFFER_API_KEY: ${{ secrets.HISTORY_PUBLISHER_BUFFER_API_KEY }}
          ONE_TIME_EPISODE: ${{ steps.window.outputs.episode }}
          EARLY_CHECK: ${{ steps.window.outputs.early }}
        run: |
          git -C source remote set-url origin https://github.com/ashivam-dot/creature-receipts.git
          if [[ "$ONE_TIME_EPISODE" == 'ep065' ]]; then
            if [[ "$EARLY_CHECK" == 'true' ]]; then
              uv run --frozen --no-dev python -m control.monitor --source source --episode ep065 --early-ep065
            else
              uv run --frozen --no-dev python -m control.monitor --source source --episode ep065
            fi
          else
            uv run --frozen --no-dev python -m control.monitor --source source
          fi
